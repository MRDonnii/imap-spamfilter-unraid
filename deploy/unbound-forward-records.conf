# EXAMPLE - copy to <app dir>/unbound-forward-records.conf and set YOUR LAN
# resolver when the network blocks DNS egress (or set it in the WebUI under
# Indstillinger -> Lokal opsætning -> Navneserver). Used only when the
# unbound.conf in use has no forward-zone of its own.
forward-zone:
    name: "."
    forward-addr: 192.168.1.1
