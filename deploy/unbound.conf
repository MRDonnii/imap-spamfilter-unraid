# Unbound for the spamfilter stack (container spamfilter-unbound).
#
# Installed by deploy/migrate-2.0.sh / recreate-infra.sh to
# $SPAMFILTER_APP/unbound.conf and bind-mounted read-only over
# /opt/unbound/etc/unbound/unbound.conf. The image's /unbound.sh only
# generates its own config when that file is missing, so this file wins;
# the script still creates dev/ and var/root.key (DNSSEC trust anchor)
# inside the chroot before exec'ing unbound.
#
# No forward-zone here: unbound resolves from the root servers. A network
# that blocks DNS egress forwards to its LAN resolver instead - set it in
# the WebUI (Indstillinger -> Lokal opsætning -> Navneserver; all-in-one:
# rendered at start) or in the app dir's unbound-forward-records.conf
# (see deploy/unbound-forward-records.conf). The resolver must pass DNSSEC
# records. Spamhaus/RBL answers are 127.0.0.x, so 127.0.0.0/8 must never be
# listed under private-address.
server:
    # --- basics ----------------------------------------------------------
    directory: "/opt/unbound/etc/unbound"
    chroot: "/opt/unbound/etc/unbound"
    username: "_unbound"
    interface: 0.0.0.0@53
    do-ip6: no
    do-daemonize: no
    do-not-query-localhost: no
    edns-buffer-size: 1232
    rrset-roundrobin: yes
    minimal-responses: yes
    ede: yes
    ede-serve-expired: yes
    # The image is built with the subnet (ECS) module, which would sit in
    # front of the cache and disable serve-expired/prefetch for its data.
    module-config: "validator iterator"

    # --- logging (stderr -> docker logs, rotated by the json-file driver) --
    # log-servfail lets host-monitor/the operator see why RBL lookups fail.
    logfile: ""
    use-syslog: no
    verbosity: 1
    log-servfail: yes
    log-queries: no
    log-replies: no
    log-local-actions: no

    # --- performance (memory limit 512m, pids-limit 512) -----------------
    num-threads: 2
    msg-cache-size: 32m
    msg-cache-slabs: 2
    rrset-cache-size: 64m
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2
    neg-cache-size: 4m
    num-queries-per-thread: 2048
    outgoing-range: 4096
    so-reuseport: yes
    sock-queue-timeout: 3
    # Short positive minimum: RBL listings are short-lived on purpose.
    cache-min-ttl: 60
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    # RFC 8767: ask upstream first; only answer from expired cache when the
    # slow forwarder has not replied within 1.8 s, and never older than 1 h
    # (stale RBL data must not linger).
    serve-expired: yes
    serve-expired-ttl: 3600
    serve-expired-client-timeout: 1800

    # --- security --------------------------------------------------------
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    auto-trust-anchor-file: "var/root.key"
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-algo-downgrade: yes
    harden-large-queries: yes
    harden-short-bufsize: yes
    harden-unknown-additional: yes
    harden-referral-path: no
    aggressive-nsec: yes
    qname-minimisation: yes
    # 0x20 case randomisation buys nothing towards a LAN forwarder and some
    # forwarders/RBL servers do not echo the case -> spurious SERVFAILs.
    use-caps-for-id: no
    deny-any: yes
    hide-identity: yes
    hide-version: yes
    val-clean-additional: yes
    unwanted-reply-threshold: 10000
    ratelimit: 1000
    delay-close: 10000
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16

remote-control:
    control-enable: no
