; supervisord for the all-in-one spamfilter container (2.4).
;
; PID 1 is tini; sf-entrypoint renders the runtime config and execs
; supervisord, which runs each part as its OWN uid (the same uids as the
; 4-container layout, so no file in the app dir ever needs a chown):
;
;   priority 10  redis    uid 999 (gid 1000)  127.0.0.1:6379 (+ ::1 if present)
;   priority 20  unbound  user unbound        127.0.0.1:5353
;   priority 30  rspamd   uid 11333           127.0.0.1:11333 / 11334
;   priority 40  filter   uid 10099           0.0.0.0:8080 (the only published port)
;   2.7, only when SF_CLAMAV is not 0 (sf-entrypoint exports
;   SF_CLAMAV_AUTOSTART=true|false, expanded in autostart= below):
;   priority 35  clamd     uid 3310 (clamav)  unix socket /run/spamfilter/clamav/clamd.sock only
;   priority 36  freshclam uid 3310 (clamav)  signature updates into /appdata/clamav
;   ClamAV is optional: rspamd fails open without it (CLAM_VIRUS_FAIL), and
;   sf-fatal-listener never stops the container for clamd / freshclam.
;
; Start order: by priority, and sf-run waits until the parts a program
; needs answer (rspamd waits for redis + unbound, the filter for rspamd and -
; 2.7 fix - for clamd when ClamAV is on and its signatures were already
; there at start: a test scan through rspamd without CLAM_VIRUS_FAIL; all
; waits together at most SF_WAIT_TIMEOUT = 120 s, then it starts anyway).
; Stop order: the reverse - the filter stops first and gets 40 s to finish
; (SIGTERM, then SIGKILL), Redis last (it saves on SIGTERM).
; Restarts: autorestart=true for every program; sf-run adds an exponential
; back-off (2 s .. 60 s) when a program keeps dying within a minute. If a
; program cannot even be started (FATAL), sf-fatal-listener stops
; supervisord so the container exits and Docker's restart policy takes over.
; Logs: every line goes to the container log with a [program] prefix.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/run/spamfilter/supervisord.pid
childlogdir=/run/spamfilter
strip_ansi=false

[unix_http_server]
file=/run/spamfilter/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/spamfilter/supervisor.sock

[program:redis]
command=/usr/local/bin/sf-run redis -- /usr/local/bin/redis-server /usr/local/etc/redis/redis.conf --bind 127.0.0.1 -::1 --port 6379 --daemonize no
user=999
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=false
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:unbound]
command=/usr/local/bin/sf-run unbound -- /usr/sbin/unbound -d -p -c /run/spamfilter/unbound/unbound.conf
user=unbound
directory=/run/spamfilter/unbound
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=false
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:rspamd]
command=/usr/local/bin/sf-run rspamd --wait redis --wait unbound -- /usr/bin/rspamd -f
user=11333
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=false
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:filter]
command=/usr/local/bin/sf-run filter --wait rspamd --wait clamav -- /usr/local/bin/python -u /app/filter.py
user=10099
directory=/app
environment=HOME="/tmp"
priority=40
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=40
stopasgroup=false
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; 2.7: clamd waits in sf-clamav (never exits) until freshclam has the first
; signatures in the app dir, so its start never fails for a missing database.
[program:clamd]
command=/usr/local/bin/sf-run clamd -- /usr/local/bin/sf-clamav clamd
user=3310
directory=/tmp
priority=35
autostart=%(ENV_SF_CLAMAV_AUTOSTART)s
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=false
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:freshclam]
command=/usr/local/bin/sf-run freshclam -- /usr/local/bin/sf-clamav freshclam
user=3310
directory=/tmp
priority=36
autostart=%(ENV_SF_CLAMAV_AUTOSTART)s
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=5
stopasgroup=false
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; 2.8 (A1): Sanesecurity's third-party signatures (GPG-verified, load-tested)
; into the same signature directory; clamd gets a RELOAD after an update.
[program:sigs]
command=/usr/local/bin/sf-run sigs -- /usr/local/bin/sf-sigs
user=3310
directory=/tmp
priority=37
autostart=%(ENV_SF_CLAMAV_AUTOSTART)s
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=5
stopasgroup=false
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[eventlistener:sf-fatal]
command=/usr/local/bin/sf-fatal-listener
events=PROCESS_STATE_FATAL
priority=1
autostart=true
autorestart=true
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
