# freshclam of the all-in-one spamfilter container (2.7), run by
# supervisord as the user clamav (uid/gid 3310) in daemon mode, in the
# foreground (log lines go to the container log as [freshclam]).
#
# First start: the signature dir in the app dir is empty, freshclam
# downloads main, daily and bytecode (~300 MB, a few minutes); clamd waits
# for it (sf-clamav) and rspamd meanwhile marks mails CLAM_VIRUS_FAIL
# (fail-open). Later starts find the signatures in the app dir and only
# fetch the differences.
#
# DNS: freshclam uses the container's normal resolver (Docker's
# resolv.conf), not the in-container Unbound - the C library cannot ask a
# resolver on port 5353. Its version check is one TXT lookup of
# current.cvd.clamav.net; the files come over HTTPS from the official
# mirror (Cloudflare). Do not raise Checks: the mirror rate-limits clients
# that check too often (freshclam then pauses itself, see freshclam.dat).

Foreground yes
LogTime yes
LogVerbose no

DatabaseDirectory /appdata/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net
ScriptedUpdates yes
Bytecode yes
# A new database is test-loaded before it replaces the old one: a broken
# download never reaches clamd.
TestDatabases yes

# 4 checks a day (every 6 hours) after the check at start.
Checks 4
MaxAttempts 3
ConnectTimeout 30
ReceiveTimeout 300

# Tell clamd to reload after an update (over its unix socket).
NotifyClamd /etc/spamfilter/clamav/clamd.conf
