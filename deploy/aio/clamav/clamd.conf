# clamd of the all-in-one spamfilter container (2.7), run by supervisord as
# the user clamav (uid/gid 3310, fixed in deploy/aio/Dockerfile) through
# sf-clamav, which waits for the first signature download (freshclam).
# rspamd asks it over the unix socket below (rspamd/local.d/antivirus.conf,
# INSTREAM: clamd never reads the mail store or any other file of the app).
#
# Only a unix socket - no TCPSocket line, nothing listens on an IP address.
# The socket's directory /run/spamfilter/clamav is created by sf-entrypoint
# as 3310:11333 (clamav:rspamd-aio) mode 0750: clamd, freshclam (NotifyClamd)
# and rspamd reach the socket, the filter, Redis and Unbound do not. The
# socket itself is 0666 because rspamd is not in clamd's group; the
# directory is the access check.
#
# Memory: the official signatures need ~1.0-1.5 GB RAM. ConcurrentDatabaseReload
# no keeps it at ONE copy: a reload (after a freshclam update, a few times
# a day) blocks scanning for ~30 s instead of doubling the memory - mails
# scanned meanwhile get CLAM_VIRUS_FAIL (fail-open). freshclam's own
# TestDatabases load is the peak (~2x for a minute), which is why the
# container's memory limit is 4g (deploy/aio/lib-aio.sh SF_AIO_MEMORY).

Foreground yes
LogTime yes
LogClean no
LogVerbose no
ExtendedDetectionInfo yes

LocalSocket /run/spamfilter/clamav/clamd.sock
LocalSocketMode 666
FixStaleSocket yes

# The signatures live in the app dir (survive a container recreate; ~300 MB).
DatabaseDirectory /appdata/clamav
# Archives are unpacked here (the container's own /tmp, not the 16 MB tmpfs).
TemporaryDirectory /tmp
LeaveTemporaryFiles no

# freshclam notifies clamd after an update (NotifyClamd); SelfCheck is the
# fallback when that notification is missed.
SelfCheck 3600
ConcurrentDatabaseReload no

# 2.7 fix: 8 scan threads. The signatures are loaded ONCE and shared by
# all threads; a thread only adds its scan buffers (a few MB, archives are
# unpacked to /tmp on disk), so 8 instead of 4 costs some tens of MB at
# most - well inside the 4 GB container - and a startup backlog of mails
# with attachments (several accounts at once) does not queue behind 4.
MaxThreads 8
MaxQueue 50
# 2.7 fix: a scan that takes longer than 5 s is stopped by clamd itself,
# before rspamd's 6 s antivirus timeout (antivirus.conf) - so rspamd gets an
# answer (with AlertExceedsMax: Heuristics.Limits.Exceeded.MaxScanTime)
# instead of CLAM_VIRUS_FAIL.
MaxScanTime 5000
ReadTimeout 60
CommandReadTimeout 30
IdleTimeout 30

# rspamd sends parts up to 20 MB (antivirus.conf max_size).
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 10000
# 2.7 fix: a file beyond the limits above (an archive bomb, too deep, too
# many files, too slow) is reported as Heuristics.Limits.Exceeded.* instead
# of passing as clean. The filter treats every Heuristics.* name as
# TH_CLAM_HEURISTIC (+4, no threat class, a Bruger can release it), so a
# big but harmless archive is never a 'virus' (filter.py clam_is_heuristic).
AlertExceedsMax yes

# Detection: the official signatures and bytecode. No PUA (adware, tools)
# and no URL heuristics. A real signature is the threat class 'virus',
# which a plain user can never release; heuristic, PUA, phishing and
# third-party signature names only give TH_CLAM_HEURISTIC +4 (filter.py
# clam_is_heuristic). Phishing signatures for attachments (HTML / PDF
# lures) stay on.
Bytecode yes
DetectPUA no
HeuristicAlerts yes
HeuristicScanPrecedence no
PhishingSignatures yes
PhishingScanURLs no
AlertBrokenExecutables no
AlertEncrypted no
AlertOLE2Macros no
AlertPhishingSSLMismatch no
AlertPhishingCloak no
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanMail yes
ScanArchive yes
