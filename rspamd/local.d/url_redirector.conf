# 2.8 (A2): follow known URL shorteners / redirectors (bit.ly, t.co, goo.gl
# ...) to the real address, so SURBL, Spamhaus DBL and the phishing lists
# check where a link really goes. rspamd 4.2 disables the module unless a
# redirector_hosts_map is set; the stock list ships with rspamd.
# Only listed redirector hosts are followed (redirectors_only), at most 5
# links per mail and 2 hops; only the redirect target is read (HEAD/GET of
# the short link, never the final page). Results are cached in Redis 24 h
# (key prefix rdr:).
redirector_hosts_map = "${CONFDIR}/maps.d/redirectors.inc";
redirectors_only = true;
max_urls = 5;
nested_limit = 2;
expire = 1d;
