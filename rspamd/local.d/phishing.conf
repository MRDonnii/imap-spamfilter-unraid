# spamfilter 2.2 (B5) - merged into the stock modules.d/
# phishing.conf (PhishTank is already on there).
#
# OpenPhish: free public feed of exact phishing URLs (stock default
# openphish_map = the public GitHub feed, refreshed by rspamd itself).
# A hit is PHISHED_OPENPHISH (+7.0). If the feed is unreachable the map is
# simply empty.
openphish_enabled = true;

# 2.6 (A5): the second feed, Phishing Army (phishing hosts), is a multimap
# rule (TH_PHISHARMY_URL in local.d/multimap.conf): this module only reads
# OpenPhish/PhishTank-style URL feeds. It has its own per-link exclusion,
# which covers every host in the exclusion map below (test-enforced).

# Hosts never reported by the phishing feeds (they get PHISHED_EXCLUDED,
# weight 0): the owner's webshops and their platform's own host.
phishing_feed_exclusion_enabled = true;
phishing_feed_exclusion_map = "$LOCAL_CONFDIR/local.d/maps.d/phishing_feed_exclusion.inc";

# Verify after deploy:
#   docker logs spamfilter-rspamd 2>&1 | grep -i -E 'openphish|phishing feed exclusions'
# must show the OpenPhish map loaded with elements and
# "parsed 6 elements from phishing feed exclusions".
