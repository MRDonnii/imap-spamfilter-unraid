# spamfilter 2.2 - own multimap rules (merged into the stock
# modules.d/multimap.conf with duplicate=merge, so the stock freemail /
# disposable / redirector rules stay). Maps live in local.d/maps.d/ and are
# installed by deploy/lib.sh together with this file. rspamd re-reads a
# changed map file by itself; the deploy hash covers maps.d as well.
#
# All rules are one_shot: with extract_from = "both" (or several matching
# addresses) a rule would otherwise add its score once per match.
#
# Verify on the host after deploy (rspamd container):
#   rspamadm configtest
#   rspamadm configdump multimap | grep -A3 TH_

# B3: brand name in the From display name. Score 0 - only counts through
# the composite TH_BRAND_SPOOF (local.d/composites.conf). The option is the
# display name, so the filter can explain the hit.
#
# MUST be type = "header" (From) with filter "email:name", NOT type = "from":
# rspamd 4.2's multimap hands a "from" rule only the bare address
# (addr = "x@y"), so email:name is always empty there and the rule never
# fires (verified with rspamc against a 4.2.2 instance). For type "header"
# the filter parses the full RFC 2047-decoded header ("Name <x@y>").
TH_FROM_BRAND_NAME {
  type = "header";
  header = "From";
  filter = "email:name";
  regexp = true;
  map = "$LOCAL_CONFDIR/local.d/maps.d/th_brand_names.re";
  description = "Afsendernavnet nævner et kendt brand (PostNord, MobilePay, bank ...)";
  group = "spamfilter_own";
  score = 0.0;
  one_shot = true;
}

# B3: the From domain (registrable part) is the brand's own or a known
# legitimate relay. Score 0 - the negative half of TH_BRAND_SPOOF.
TH_FROM_BRAND_DOMAIN {
  type = "from";
  extract_from = "mime";
  filter = "email:domain:tld";
  map = "$LOCAL_CONFDIR/local.d/maps.d/th_brand_domains.map";
  description = "Afsenderdomænet tilhører brandet selv eller en kendt formidler";
  group = "spamfilter_own";
  score = 0.0;
  one_shot = true;
}

# B3: Greek/Cyrillic/IPA/Armenian/Coptic look-alike letters in the display
# name ("ΕasyΡark"). type = "header" for the same reason as above.
TH_FROM_NAME_HOMOGLYPH {
  type = "header";
  header = "From";
  filter = "email:name";
  regexp = true;
  map = "$LOCAL_CONFDIR/local.d/maps.d/th_homoglyph.re";
  description = "Afsendernavnet bruger græske/kyrilliske bogstaver, der ligner latinske";
  group = "spamfilter_own";
  score = 5.0;
  one_shot = true;
}

# B3: Danish/English payment, parcel, account and prize lures in the
# Subject. Low on its own; TH_LURE_COMBO adds more with a fake sender.
TH_LURE_SUBJECT {
  type = "header";
  header = "Subject";
  regexp = true;
  map = "$LOCAL_CONFDIR/local.d/maps.d/th_lure_subjects.re";
  description = "Emnet ligner en typisk lokkemail (betaling, pakke, konto, gevinst)";
  group = "spamfilter_own";
  score = 1.5;
  one_shot = true;
}

# 2.6 (A1): the strong subset of the lures above - asks for payment or
# account details, identity / MitID, or claims a failed payment, unpaid
# freight or a blocked account. Score 0 - only counts through the
# composite TH_SUBJECT_BRAND_SPOOF. Every strong subject also hits
# TH_LURE_SUBJECT (test-enforced), so the 1.5 is not lost.
TH_LURE_SUBJECT_STRONG {
  type = "header";
  header = "Subject";
  regexp = true;
  map = "$LOCAL_CONFDIR/local.d/maps.d/th_lure_subjects_strong.re";
  description = "Emnet beder om betalings-, konto- eller MitID-oplysninger";
  group = "spamfilter_own";
  score = 0.0;
  one_shot = true;
}

# 2.6 (A1): brand name in the SUBJECT ("EasyPark AB-Opdater dine
# betalingsoplysninger" from send.reviewmgr.com). Score 0 - only counts
# through the composite TH_SUBJECT_BRAND_SPOOF (brand + strong lure + a
# sender that is not the brand's own domain). Own list: the display-name
# patterns are partly anchored ^...$ and too loose for free text.
TH_SUBJECT_BRAND {
  type = "header";
  header = "Subject";
  regexp = true;
  map = "$LOCAL_CONFDIR/local.d/maps.d/th_subject_brands.re";
  description = "Emnet nævner et kendt brand (PostNord, MobilePay, Tryg, bank ...)";
  group = "spamfilter_own";
  score = 0.0;
  one_shot = true;
}

# B4: sender domain (envelope AND From header) on a TLD that spam
# campaigns rotate through (.homes, .guru, .help, .xyz ...).
TH_FROM_ABUSED_TLD {
  type = "from";
  extract_from = "both";
  filter = "email:domain";
  regexp = true;
  map = "$LOCAL_CONFDIR/local.d/maps.d/th_abused_tlds.re";
  description = "Afsenderdomænet ligger på et topdomæne, som spammere misbruger";
  group = "spamfilter_own";
  score = 5.0;
  one_shot = true;
}

# 2.7.6: envelope sender on Google's relay for Gmail users (score 0 -
# only counts through the composite TH_FREEMAIL_VIA_GOOGLE).
TH_GOOGLE_RELAY_ENV {
  type = "from";
  extract_from = "smtp";
  filter = "email:domain";
  map = "$LOCAL_CONFDIR/local.d/maps.d/th_google_relay_env.map";
  description = "Mailen er sendt gennem Googles relæ for Gmail-brugere";
  group = "spamfilter_own";
  score = 0.0;
  one_shot = true;
}

# B4: .cn / .ru sender domains - low, genuine suppliers exist.
TH_FROM_TLD_CN_RU {
  type = "from";
  extract_from = "both";
  filter = "email:domain";
  regexp = true;
  map = "$LOCAL_CONFDIR/local.d/maps.d/th_tld_cn_ru.re";
  description = "Afsenderdomænet ligger under .cn eller .ru";
  group = "spamfilter_own";
  score = 2.0;
  one_shot = true;
}

# 2.6 (A5): Phishing Army - a free, no-key community blocklist of phishing
# HOSTS (aggregated from PhishTank, OpenPhish, CERT.PL, urlscan.io ...;
# about 150,000 entries, rebuilt every few hours). rspamd fetches it
# itself; no filter is set, so the rule compares every link's exact host
# (www. variants are separate entries in the feed). The option is the host.
#
# Not a threat class (filter.THREAT_PHISH stays OpenPhish/PhishTank/
# Spamhaus/SURBL): the feed lists whole hosts, not exact URLs, and also
# carries the roots of shorteners and platforms that legitimate mail links
# to (hubs.ly - HubSpot, conta.cc - Constant Contact, www.wixsite.com were
# all listed on 2026-11-02). So it is a score symbol only, well below the
# thresholds (6 / 7 for protected recipients): it needs other evidence
# (Bayes, authentication, a lure) to move a mail. The name deliberately
# does NOT start with PHISHED_: the filter treats every PHISHED_* hit as
# hard phishing evidence (no ham learning, no trust bonus for known
# contacts, Bayes repair), which a host-level list with platform roots
# must not trigger. The filter counts it as URL reputation only (no B2
# own-platform offset, rescans may pick up a late listing).
#
# Exclusions are per link: the "regexp:" URL filter only passes a host that
# is NOT one of the owner's hosts (the local site config's domains, put in
# front of the list at container start by deploy/aio/aio_render.py) or a
# shortener/platform ROOT
# (subdomains such as evil.weebly.com are still checked). The pattern
# avoids "$" (UCL variable expansion) and backslashes (UCL escapes): [.]
# is a literal dot, (?![a-z0-9_.-]) is end-of-host.
#
# Refresh: poll = 12 h. rspamd 4.2 sends a conditional GET (the feed has
# Last-Modified) and caps the interval at 8 h, so it is about 3 requests a
# day. The last good copy is kept in rspamd's map cache under
# /var/lib/rspamd (persistent volume) and used after a restart; if the
# feed is unreachable the rule simply keeps the old copy (or matches
# nothing on a fresh install) - it never blocks startup.
TH_PHISHARMY_URL {
  type = "url";
  filter = "regexp:/^(?!(www[.])?(hubs[.]ly|conta[.]cc|dub[.]sh|wixsite[.]com|bit[.]ly|tinyurl[.]com|t[.]co|lnkd[.]in|linktr[.]ee|mailchi[.]mp|list-manage[.]com|forms[.]gle|sites[.]google[.]com|docs[.]google[.]com|drive[.]google[.]com)(?![a-z0-9_.-])).+/i";
  map = {
    url = "https://phishing.army/download/phishing_army_blocklist.txt";
    poll = 43200;
  };
  description = "Link til en kendt phishing-side (Phishing Army)";
  group = "spamfilter_own";
  score = 3.0;
  one_shot = true;
}
