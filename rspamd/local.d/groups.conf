# spamfilter - symbol weight overrides (merged into the stock
# groups.conf: it ends with
#   .include(try=true; priority=1; duplicate=merge) "$LOCAL_CONFDIR/local.d/groups.conf"
# so a group/symbol defined here is MERGED with rspamd's own definition. The
# include has priority 1, so for a key that also exists in the stock
# scores.d/<group>_group.conf (priority 0) the value below REPLACES the stock
# one, and a config weight always wins over a Lua/composite registration
# score). One file instead of several local.d/<group>_group.conf files.
#
# Syntax (rspamd 4.2):
#   group "<group>" { symbols { "<SYMBOL>" { weight = <n>; } } }
# A wrong group name only adds an extra group to the symbol; the weight
# still applies. Symbols are put in the group rspamd itself registers them
# in, so group max_score limits stay as they were.
#
# Verify on the host after deploy (rspamd container):
#   rspamadm configtest
#   rspamadm configdump -j group | grep -A2 '"<SYMBOL>"'
#
# Rollback: delete this file (stock weights again).
#
# Deliberately NOT changed (2.2 backlog): DMARC_POLICY_REJECT stays 2.0
# (conflict K3, the false hits come from late scans - B7) and
# SEM_URIBL_FRESH15 stays 3.0 (it caught real phishing).

# 2.1: HIDDEN_TEXT (rules/html.lua, group "html"): registered with score 5.0
# and inserted with the dynamic factor hidden_chars / 500 (<= 1.0), so it
# scored up to 5.0. Legitimate newsletters (preheader text hidden with
# display:none / tiny fonts) trip it constantly. weight = 2.0 caps it at
# 2.0 (factor 0.4..1.0 -> 0.8..2.0).
group "html" {
    symbols {
        "HIDDEN_TEXT" {
            weight = 2.0;
            description = "Significant amount of hidden text (capped at 2.0 here)";
        }
    }
}

# 2.6 (A2): our own fuzzy storage (fuzzy_check.conf.readonly, rule
# "local"): mail a user of this filter marked as spam. 4.0 on its own stays
# below every threshold (a wrongly marked newsletter never moves on this
# alone); with Bayes or any other spam signal the copy is caught.
group "fuzzy" {
    symbols {
        "FUZZY_LOCAL_SPAM" {
            weight = 4.0;
            description = "Same content as mail a user of this filter marked as spam (local fuzzy storage)";
        }
    }
}

# 2.2 (B1): rules that mostly hit the owners' legitimate newsletters,
# invoices and webshop mail. Spam-hit % / ham-hit % in the 2.2 sample.

# URL reputation of the big ESPs (Klaviyo, Mandrill, Sendgrid, Mailjet;
# Outlook Message-ID "hxcore.ol").
group "surbl" {
    symbols {
        # stock 2.5; 3.8 % spam / 26.1 % ham
        "URIBL_GREY" {
            weight = 0.5;
        }
        # stock 3.5; 2.3 % spam / 12.7 % ham
        "SEM_URIBL" {
            weight = 1.0;
        }
    }
}

group "headers" {
    symbols {
        # Lua score 1.0; hits 98 % of all late (re)scanned mail - an age
        # artefact of a post-delivery filter, not a spam signal.
        "DATE_IN_PAST" {
            weight = 0.0;
        }
        # stock 0.3; 11.5 % spam / 56.5 % ham
        "FORGED_SENDER" {
            weight = 0.0;
        }
        # stock 2.0; e-conomic BCC invoice copies to handel
        "FORGED_RECIPIENTS" {
            weight = 0.5;
        }
        # Lua score 0.5; 10.7 % spam / 18.4 % ham
        "MV_CASE" {
            weight = 0.1;
        }
        # Lua score 2.0; 0 % spam / 3.9 % ham
        "MISSING_MIMEOLE" {
            weight = 0.5;
        }
        # composite (stock score 2.0, no group); 0.8 % spam / 2.1 % ham
        # (club mail)
        "FREEMAIL_REPLYTO_NEQ_FROM" {
            weight = 1.0;
        }
    }
}

group "hfilter" {
    symbols {
        # stock 1.0; Microsoft 365 outbound, 12 % of ham
        "HFILTER_HELO_IP_A" {
            weight = 0.5;
        }
    }
}

group "mime_types" {
    symbols {
        # stock 4.0; Datamail "faktura*.pdf". 1.0 since the hard attachment
        # policy is live (2.3 B17, conflict K2): dangerous types are blocked
        # by the engine (TH_ATTACH_BLOCK +20), this is only a content hint.
        "MIME_BAD_ATTACHMENT" {
            weight = 1.0;
        }
    }
}

group "url" {
    symbols {
        # Lua score 1.0; 17.6 % spam / 26.1 % ham
        "URI_COUNT_ODD" {
            weight = 0.3;
        }
        # composite (stock score 1.0, no group); 14.5 % spam / 20.5 % ham
        "SUSPICIOUS_URL_IN_SUSPICIOUS_MESSAGE" {
            weight = 0.5;
        }
    }
}

