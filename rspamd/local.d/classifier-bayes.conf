# Per-identity Bayes in Redis. The filter sends "Deliver-To: <bayes_user>"
# so all mailboxes share one pool (accounts.yml defaults.bayes_user, e.g. spamfilter).
backend = "redis";
new_schema = true;
users_enabled = true;
min_tokens = 11;
min_learns = 200;
# No "expire" key on purpose: any number enables bayes_expiry, and the old
# "expire = 0" made it EXPIRE infrequent tokens with TTL 0 (= delete them)
# on every expiry cycle. Without the key learned tokens are kept forever.

# autolearn is OFF (as in 1.x): Bayes learns only from explicit user moves,
# WebUI actions and training jobs. Every /checkv2 scan - shadow mode and the
# read-only calibration jobs included - would otherwise be able to write to
# the shared pool. Owner decision pending; to enable later, replace
# the line below with:
#   autolearn {
#       spam_threshold = 12.0;
#       junk_threshold = 12.0;
#       ham_threshold = -1.5;
#       check_balance = true;
#       min_balance = 0.9;
#   }
autolearn = false;
