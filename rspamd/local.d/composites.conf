# spamfilter 2.2 - own composites (merged into the stock
# composites.conf with duplicate=merge). All use policy "leave": the
# member symbols stay in the result (the filter shows them as reasons).
#
# Verify on the host after deploy (rspamd container):
#   rspamadm configtest
#   rspamadm configdump composites | grep -A5 TH_

# B3: a brand name in the display name, sent from a domain that is not the
# brand's own (or a known relay): "PostNord <x@goteamup.com>".
TH_BRAND_SPOOF {
  expression = "TH_FROM_BRAND_NAME & !TH_FROM_BRAND_DOMAIN";
  score = 5.0;
  policy = "leave";
  group = "spamfilter_own";
  description = "Afsendernavnet udgiver sig for et brand, men mailen kommer fra et andet domæne";
}

# B3/B4: a lure subject together with a fake or suspicious sender.
TH_LURE_COMBO {
  expression = "TH_LURE_SUBJECT & (TH_BRAND_SPOOF | TH_FROM_NAME_HOMOGLYPH | TH_FROM_ABUSED_TLD)";
  score = 4.0;
  policy = "leave";
  group = "spamfilter_own";
  description = "Lokkende emne fra en falsk eller mistænkelig afsender";
}

# 2.6 (A1): the brand is only in the SUBJECT ("EasyPark AB-Opdater dine
# betalingsoplysninger" from send.reviewmgr.com, "Forbind din MobilePay
# til MitID" from a .club domain): a brand name + a STRONG lure subject
# (TH_LURE_SUBJECT_STRONG: payment/account details, identity, MitID,
# failed payment, unpaid freight, blocked account - never the generic
# "... er på vej", "handling påkrævet", refund or parcel notices, which
# shops, banks and carriers send legitimately), and the sender is not the
# brand's own domain. Two refinements:
# - FREEMAIL_FROM (stock multimap): outlook.com / hotmail.com / live.com /
#   icloud.com are in th_brand_domains.map for Microsoft and Apple, but
#   anybody can send from them, so they never exempt a subject brand.
# - !TH_BRAND_SPOOF: when the display name already impersonates a brand,
#   TH_BRAND_SPOOF (+5) and TH_LURE_COMBO (+4) score the mail; this one
#   does not stack on top (a reseller missing from th_brand_domains.map
#   would otherwise get +15 for one mistake).
# 2.5 (with TH_LURE_SUBJECT 4.0): the thresholds are 6 (normal) and 7
# (protected recipients), and a third party can mention a brand in such a
# subject legitimately (a webshop's "MobilePay-betalingen kunne ikke
# gennemføres"), so the subject alone must stay clearly below 5. Real
# phishing gets the rest from Bayes, URLs and failed authentication.
TH_SUBJECT_BRAND_SPOOF {
  expression = "TH_SUBJECT_BRAND & TH_LURE_SUBJECT_STRONG & (!TH_FROM_BRAND_DOMAIN | FREEMAIL_FROM) & !TH_BRAND_SPOOF";
  score = 2.5;
  policy = "leave";
  group = "spamfilter_own";
  description = "Emnet udgiver sig for at komme fra et brand og lokker, men mailen kommer fra et andet domæne";
}


# 2.7.6: a Gmail/freemail From relayed by Google (envelope sender
# @maestro.bounces.google.com): random Gmail addresses sending "Meddelelse
# vedrørende din konto" / "Handling påkrævet for at bevare dine filer"
# phishing through a Google service, which passes SPF, DKIM and DMARC.
# Known contacts keep the filter's trust bonus (-2..-4) on top.
TH_FREEMAIL_VIA_GOOGLE {
  expression = "TH_GOOGLE_RELAY_ENV & FREEMAIL_FROM";
  score = 7.0;
  policy = "leave";
  group = "spamfilter_own";
  description = "Ukendt Gmail-afsender sendt gennem Googles relæ (typisk phishing)";
}
