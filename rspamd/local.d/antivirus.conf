# spamfilter 2.7 - virus scanning with ClamAV (merged into the
# stock modules.d/antivirus.conf, i.e. the antivirus { } section).
#
# clamd runs inside the all-in-one container (deploy/aio/clamav/clamd.conf)
# and listens ONLY on a unix socket in the tmpfs: no TCP port at all. The
# socket's directory is clamav:rspamd-aio (3310:11333) mode 0750, so of all
# the programs in the container only clamd itself and rspamd can reach it.
#
# This is post-delivery IMAP filtering: there is no SMTP session to reject.
# No 'action' is set - a hit only adds CLAM_VIRUS (with the signature name
# as option, score 0 here); the filter's own threat logic turns it into the
# threat class 'virus' (always to Spamfilter, never released by a plain
# user, alert / push like the other threats; filter/filter.py THREAT_VIRUS).
# 2.7 fix: heuristic, PUA, phishing and third-party signature names
# (Heuristics.*, PUA.*, Sanesecurity.* ...) only give TH_CLAM_HEURISTIC +4
# (filter.py clam_is_heuristic). A CLAM_VIRUS_FAIL on a mail with
# attachments is re-scanned by the filter (+10 min, +1 h, +6 h).
#
# Only the all-in-one container has clamd: the 4-container layout gets
# antivirus.conf.legacy (enabled = false) from deploy/lib.sh.
#
# Fail-open: when clamd is down, still downloading its first signatures or
# too slow, rspamd adds CLAM_VIRUS_FAIL (score 0, no verdict) and the mail is
# judged on everything else. The filter never treats a _FAIL symbol as
# evidence (url_reputation_hits / reputation_symbols), and sf-health /
# sfctl doctor report clamd as a warning.
#
# SF_CLAMAV=0 (container env): sf-entrypoint renders this file as
# 'enabled = false;' into the runtime copy (aio_render.py --no-antivirus),
# so rspamd does not try the socket for every mail.
#
# 'whitelist' and 'patterns' stay at the module defaults: every clamd hit is
# CLAM_VIRUS.
#
# Timing: rspamd's task timeout is 25 s since 2.12 (options.inc; DNS ~6 s runs in
# parallel). One try of at most 6 s, no retransmit - a timeout must end as
# CLAM_VIRUS_FAIL, not as a task cut off without any symbol. Results are
# cached in Redis by content hash (module default), so a rescan (2.3 zap)
# does not ask clamd again for the same attachment.
#
# Verify after deploy:
#   docker exec spamfilter sfctl doctor          (ClamAV line)
#   docker exec -u 11333:11333 spamfilter rspamadm configdump antivirus

clamav {
    type = "clamav";
    servers = "/run/spamfilter/clamav/clamd.sock";
    symbol = "CLAM_VIRUS";
    symbol_fail = "CLAM_VIRUS_FAIL";
    # Attachments one by one (archives are unpacked by clamd) and, since
    # 2.8 (A1), the text parts too: the Sanesecurity phishing/scam lists
    # match mail text. Image parts are not sent.
    scan_mime_parts = true;
    scan_text_mime = true;
    scan_image_mime = false;
    # Parts above 20 MB are not scanned (clamd.conf StreamMaxLength 25M).
    max_size = 20000000;
    timeout = 6.0;
    retransmits = 0;
    log_clean = false;
}
